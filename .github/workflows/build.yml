name: Build Laya

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laya-${{ github.ref }}
  cancel-in-progress: true

env:
  HF: https://huggingface.co/ti3x-m/laya-multilingual-onnx/resolve/main
  LOG: ${{ github.workspace }}/../job.log

defaults:
  run:
    shell: bash

jobs:
  model-parity:
    name: Model parity (JVM, real int8 model)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Cache model bundle
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/laya
          key: laya-multilingual-int8-67d6997d-v1
      - name: Download model bundle
        run: |
          set -euo pipefail
          exec > >(tee -a "$LOG") 2>&1
          D="$RUNNER_TEMP/laya"; mkdir -p "$D"
          get() { [ -s "$D/$2" ] || curl -fsSL --retry 5 -o "$D/$2" "$HF/$1"; }
          get onnxruntime/wasm/int8-block-64/model.onnx model.onnx
          get onnxruntime/wasm/int8-block-64/model.onnx_data model.onnx_data
          get onnxruntime/wasm/int8-block-64/reference.json reference.json
          get tokenizer/tokenizer.json tokenizer.json
          get laya_config.json laya_config.json
          cd "$D"
          printf '%s\n' \
            "f0e09e9672a2a233447c638350644388dc4eec198bf22667588d486f55a0250a  model.onnx" \
            "67d6997de3ebe0dba0c114793d2bdde22906013afbb6060f20e8051e64795532  model.onnx_data" \
            "609d8f4c067cd3950f88594c5a802616cea245823836ef5848ee4fc40aab5b6f  tokenizer.json" \
            "b1a3dd900e0fd358d1adc325b4234f86b5026bb240ddf7191f7f102f63a1c450  laya_config.json" > expected.sha
          sha256sum -c expected.sha
      - name: Sequence golden + model parity tests
        env:
          LAYA_MODEL_DIR: ${{ runner.temp }}/laya
        run: |
          set -o pipefail
          gradle --no-daemon :laya-core:test 2>&1 | tee -a "$LOG"
      - name: Publish log to branch ci-log-parity
        if: always()
        run: .github/publish-log.sh ci-log-parity "${{ github.token }}"

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK (preinstalled on the runner)
        run: |
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" | tee -a "$LOG"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" 2>&1 | tail -5 | tee -a "$LOG"
      - name: Build
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleRelease 2>&1 | tee -a "$LOG"
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk out/Laya.apk && ls -la out | tee -a "$LOG"
      - uses: actions/upload-artifact@v4
        with:
          name: Laya-APK
          path: out/Laya.apk
          if-no-files-found: error
      - name: Publish phone download (release "latest")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest out/Laya.apk \
              --title "Laya (latest build)" \
              --notes "Built from ${GITHUB_SHA::7}. Install Laya.apk on the phone, open it and tap 'Baixar modelo'." \
              --latest
          } 2>&1 | tee -a "$LOG"
      - name: Publish log to branch ci-log-apk
        if: always()
        run: .github/publish-log.sh ci-log-apk "${{ github.token }}"

  device-test:
    name: On-device test (emulator, in-app download + inference)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK (preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Build app and tests
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee -a "$LOG"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest > ../gradle-device.log 2>&1; echo $? > ../device-exit.txt
            adb logcat -d -s LayaTest:V AndroidRuntime:E TestRunner:V > ../device-logcat.txt || true
      - name: Collect device results
        if: always()
        run: |
          { echo "== gradle"; tail -n 150 ../gradle-device.log; echo "== logcat"; tail -n 200 ../device-logcat.txt; } >> "$LOG" 2>&1 || true
          exit "$(cat ../device-exit.txt 2>/dev/null || echo 1)"
      - name: Publish log to branch ci-log-device
        if: always()
        run: .github/publish-log.sh ci-log-device "${{ github.token }}"
