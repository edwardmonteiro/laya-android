name: Build Perception Local

on:
  push:
    branches: [perception-mvp]
    paths:
      - 'perception-app/**'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/perception.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Build PerceptionLocal APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Build debug APK
        run: gradle --no-daemon :perception-app:assembleDebug
      - name: Prepare artifact
        run: |
          mkdir -p out
          cp perception-app/build/outputs/apk/debug/perception-app-debug.apk out/PerceptionLocal.apk
          ls -lh out/PerceptionLocal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PerceptionLocal-APK
          path: out/PerceptionLocal.apk
          if-no-files-found: error
